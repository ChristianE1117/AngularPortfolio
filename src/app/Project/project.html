<div class="search-container">
    <input type="text" [(ngModel)]="searchString" (ngModelChange)="inputChanged($event)" placeholder="Search Projects"/>
</div>

<div class="projects">
    <ul class="projects-container">
        @for (project of projects; track project.name) {
        <li class="projectListItem">
            <h2 class="projectTitle">{{project.name}}</h2>
            <p>Date Completed: {{project.date}}</p>
            <p>Project Difficulty: {{project.difficulty}}</p>
        </li>
        } @empty {
            <p>No Items</p>
        }
    </ul>
</div>
